name: Firebase sync

# Mirrors canonical repository content into Cloud Firestore.
#
# The canonical repository at github.com/Oqthara/oqthara stays the source of truth; this job
# copies it. The site prefers the mirror and falls back to GitHub, so a failed run degrades
# freshness, never correctness.
#
# This workflow writes content and nothing else. It never calls the Firebase Rules API, so it
# needs no `firebaserules.*` permission and a broken rules credential cannot block a sync.
# Security rules have their own workflow: `.github/workflows/firestore-rules.yml`.
#
# Required secret: FIREBASE_SERVICE_ACCOUNT — the JSON key of the service account
# oqthara-github-sync@oqthara.iam.gserviceaccount.com in project oqthara, with the
# "Cloud Datastore User" role for the Admin SDK writes. Create it in the Firebase console
# (Project settings -> Service accounts -> Generate new private key) and add the whole file as
# a repository secret. The key is never printed and never committed; the only fields that appear
# in a log are `client_email` and `project_id`, which are not secrets.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Full reconciliation (rewrite every document)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (read GitHub, print the diff, write nothing)"
        type: boolean
        default: false
  schedule:
    # Daily at 03:17 UTC. A fixed odd minute avoids the top-of-hour runner spike.
    - cron: "17 3 * * *"
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read

# Shares the mirror's concurrency group with `alpha-release-sync.yml`. See the note there: each
# workflow serializing only itself is not enough when both write the same collections.
concurrency:
  group: firestore-mirror
  cancel-in-progress: false

jobs:
  sync:
    name: Sync canonical content to Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the site repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No job here pushes, so the job token has no reason to stay readable in .git/config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22, not 24: superstatic (a firebase-tools dependency) declares
          # "18 || 20 || 22" and warns EBADENGINE on 24. The rest of CI already runs 22.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check for the service account secret
        id: credential
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_ACCOUNT}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set. The mirror cannot be updated."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validate, and report only the two non-secret identity fields.
          node -e '
            const raw = process.env.SERVICE_ACCOUNT;
            let parsed;
            try { parsed = JSON.parse(raw); } catch { console.error("::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON"); process.exit(1); }
            if (!parsed.client_email || !parsed.private_key) {
              console.error("::error::FIREBASE_SERVICE_ACCOUNT is not a service account key");
              process.exit(1);
            }
            console.log(`client_email: ${parsed.client_email}`);
            console.log(`project_id: ${parsed.project_id}`);
          '
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Verify the credential identity and Cloud project
        if: steps.credential.outputs.present == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # Identity only: no Google API call, so a content sync never depends on Rules
        # permissions. A mismatch stops the run instead of writing to the wrong project.
        run: node scripts/check-firebase-access.mjs --identity-only

      - name: Fail closed when the credential is missing
        if: steps.credential.outputs.present != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          echo "::error::FIREBASE_SERVICE_ACCOUNT is not configured, so the mirror cannot be updated."
          echo "Add the service account JSON as a repository secret, or run this workflow manually with dry_run=true."
          exit 1

      - name: Dry run (no credentials required)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: node scripts/sync-firestore.mjs --dry-run ${FULL:+"$FULL"}

      - name: Sync
        if: steps.credential.outputs.present == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: node scripts/sync-firestore.mjs ${FULL:+"$FULL"}
