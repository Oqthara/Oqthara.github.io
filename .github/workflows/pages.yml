name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build job reads the repository and nothing else. Deploying needs the Pages write scope and
# an OIDC token, and both are granted on the `deploy` job instead of workflow-wide: the build job
# runs `npm ci`, a rules emulator and a browser suite, which is the widest surface here and has no
# reason to be able to publish.
permissions:
  contents: read

# A pull request must not be able to cancel the run that is deploying production. Sharing one
# group does exactly that: a merge landing while a push run is still in its browser suite
# cancels the push run, and the commit that is actually being published then goes out with its
# suite cut short. The group is keyed by ref so a newer push to the same branch still supersedes
# an older one, while pull requests queue behind their own ref instead of cancelling `main`.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No job here pushes, so the job token has no reason to stay readable in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      # `firebase-tools` 15 refuses to start the emulator on a JRE older than 21, and the
      # runner image does not ship one. The emulator is the only thing that needs the JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore security rules
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Verify the prerendered output
        run: node verify.mjs

      - name: Validate HTML
        run: npx --no-install html-validate --formatter stylish _site/*.html

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      - name: Live source tests
        run: npm run test:live

      # The syntax grammar is hand-maintained, so it drifts whenever the language gains a keyword
      # or a global function. This compares it against the generated reference on `main` and fails
      # the build on any difference, rather than letting published code blocks render unhighlighted.
      - name: Grammar drift audit
        run: npm run audit:grammar

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  cross-browser:
    name: Cross-browser suite
    # Firefox could not launch on the macOS host used for local work: the binary runs but exits
    # with "Could not find profile folder.", which reproduced outside Playwright and is therefore
    # an environment fault rather than a site fault. This job is the supported environment that
    # settles it. The `PW_ENGINES=all` switch is what the browser suite reads to include every
    # installed engine, so installing Firefox here is all that is needed to cover it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # `PW_ENGINES=all` runs every project in playwright.config.js, and that file documents CI
      # installing all three engines, so all three are installed here. Installing a subset leaves
      # the missing project failing on "Executable doesn't exist" in a few milliseconds, which
      # reads like a site failure and is not one.
      - name: Install every Playwright engine
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests in every installed engine
        run: npx playwright test
        env:
          PW_ENGINES: all

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level ones rather than adding to them, so this
    # job must list everything it needs. It needs exactly two things: `pages: write` to publish
    # and `id-token: write` for the OIDC exchange deploy-pages performs. It deliberately does
    # NOT grant `contents: read`, because there is no checkout here any more - the site comes
    # from the artifact the build job uploaded. `tests/workflow-contract.test.js` pins that
    # pairing, so a checkout cannot reappear without `contents: read`.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Smoke test the deployed site
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Base URL: $BASE_URL"

          # Every route the site publishes is one real file. Documentation and examples are
          # served by a single route each and are exercised further down.
          routes="/ /philosophy.html /tour.html /docs.html /document.html /examples.html /example.html /stdlib.html /changelog.html /status.html /404.html"

          for attempt in 1 2 3 4 5 6; do
            root_status=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL")
            if [ "$root_status" = "200" ]; then break; fi
            echo "root returned $root_status (attempt $attempt), retrying"
            sleep 10
          done

          failed=0
          for route in $routes; do
            url="${BASE_URL%/}${route}"
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$status $url"
            if [ "$status" != "200" ]; then
              echo "::error::$url returned $status"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

          check_contains() {
            local url="$1" needle="$2" body
            body=$(curl -sS --fail "$url")
            if ! printf '%s' "$body" | grep -Fq "$needle"; then
              echo "::error::$url does not contain: $needle"
              exit 1
            fi
            echo "ok $url contains \"$needle\""
          }

          check_contains "${BASE_URL%/}/" "reads like"
          check_contains "${BASE_URL%/}/philosophy.html" "What Oqthara is trying to be"
          check_contains "${BASE_URL%/}/tour.html" "Learn Oqthara in one sitting"
          check_contains "${BASE_URL%/}/docs.html" "Documentation"
          check_contains "${BASE_URL%/}/examples.html" "Examples"
          check_contains "${BASE_URL%/}/document.html" "Opening the document"
          check_contains "${BASE_URL%/}/example.html" "Opening the example"
          check_contains "${BASE_URL%/}/stdlib.html" "Standard library"
          check_contains "${BASE_URL%/}/changelog.html" "Changelog"
          check_contains "${BASE_URL%/}/status.html" "stated plainly"
          check_contains "${BASE_URL%/}/404.html" "does not exist"

          # The homepage must not ship a Playground again.
          root_html=$(curl -sS --fail "${BASE_URL%/}/")
          if printf '%s' "$root_html" | grep -Fiq 'playground'; then
            echo "::error::the homepage still mentions a Playground"
            exit 1
          fi

          # A document discovered from GitHub must open on the canonical route, and a legacy
          # /docs/**.html address must still work through 404.html's redirect.
          doc_url="${BASE_URL%/}/document.html?path=docs%2Fspec%2Flanguage.md&ref=main"
          doc_status=$(curl -s -o /dev/null -w '%{http_code}' "$doc_url")
          echo "$doc_status $doc_url"
          if [ "$doc_status" != "200" ]; then
            echo "::error::the canonical document route returned $doc_status"
            exit 1
          fi
          check_contains "${BASE_URL%/}/document.html?path=docs%2Fadr%2F0003-bytecode.md&ref=main" "Opening the document"

          legacy_status=$(curl -s -o /dev/null -w '%{http_code}' "${BASE_URL%/}/docs/spec/language.html")
          echo "$legacy_status ${BASE_URL%/}/docs/spec/language.html (legacy path, 404.html handles it)"
          if [ "$legacy_status" != "404" ]; then
            echo "::error::a legacy document path should be served by 404.html, got $legacy_status"
            exit 1
          fi

          # A pinned release must be reachable on its own ref.
          pinned_url="${BASE_URL%/}/document.html?path=docs%2Fspec%2Flanguage.md&ref=v0.1.0-alpha.2"
          pinned_status=$(curl -s -o /dev/null -w '%{http_code}' "$pinned_url")
          echo "$pinned_status $pinned_url"
          if [ "$pinned_status" != "200" ]; then
            echo "::error::the pinned document route returned $pinned_status"
            exit 1
          fi

          # A deep link must render real prerendered text, not an empty shell.
          for attempt in 1 2; do
            body=$(curl -sS --fail "${BASE_URL%/}/tour.html")
            if printf '%s' "$body" | grep -Fq '<div id="root"></div>'; then
              echo "::error::/tour.html served an empty React shell on request $attempt"
              exit 1
            fi
            if ! printf '%s' "$body" | grep -Fq "Learn Oqthara in one sitting"; then
              echo "::error::/tour.html lost its prerendered text on request $attempt"
              exit 1
            fi
          done
          echo "deep link /tour.html served prerendered content twice"

          legacy_project=$(curl -s -o /dev/null -w '%{http_code}' "https://oqthara.github.io/oqthara/")
          echo "$legacy_project https://oqthara.github.io/oqthara/ (retired project path)"

          # Assets referenced by the root page must resolve.
          for asset in $(printf '%s' "$root_html" | grep -oE '/assets/[A-Za-z0-9._-]+\.(css|js)' | sort -u); do
            asset_status=$(curl -s -o /dev/null -w '%{http_code}' "${BASE_URL%/}${asset}")
            echo "$asset_status $asset"
            if [ "$asset_status" != "200" ]; then
              echo "::error::$asset returned $asset_status"
              exit 1
            fi
          done
