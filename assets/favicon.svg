<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Oqthara">
  <style>
    /* The mark follows the browser's own light/dark preference, not the site's stored theme,
       because a tab strip can differ from the page inside it. Filled in both directions, so
       it stays legible against light and dark chrome rather than disappearing into one. */
    .plate { fill: #6ee7a0; }
    .glyph { fill: #04160d; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #34d399; }
      .glyph { fill: #04160d; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7"/>
  <text class="glyph" x="16" y="22" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="17" font-weight="700" letter-spacing="-1">oq</text>
</svg>
